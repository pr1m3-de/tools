  <style>
    /* Übersicht: nach Bereichen gegliedert, ohne Hashtags */
    .werkzeug { display: flex; flex-direction: column; gap: 10px; margin: 18px 0 6px; position: sticky; top: 0; z-index: 6; background: var(--grund); padding: 10px 0 8px; }

      flex: 1 1 auto; min-width: 0; padding: 11px 16px; border: 1px solid var(--linie); border-radius: 999px; background: var(--flaeche); font-size: 1.02rem;
    }

    .ansicht button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--leise); padding: 7px 12px; border-radius: 999px; cursor: pointer; font: inherit; font-family: var(--technik); font-size: .92rem; }

    /* Handy: Bereiche in einer wischbaren Zeile statt vieler Zeilen */

      #reiter { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -18px; padding: 0 18px 2px; scroll-padding: 0 18px; scroll-snap-type: x proximity; -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 28px), transparent 100%); mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 28px), transparent 100%); }
      #reiter::-webkit-scrollbar { display: none; }
      #reiter button { flex: none; scroll-snap-align: start; padding: 6px 12px; font-size: .95rem; }
    }
    .zuletzt { margin: 20px 0 0; }
    .zuletzt h2 { font-size: 1rem; font-family: var(--technik); color: var(--leise); margin: 0 0 8px; font-weight: 600; }

    .zuletzt-liste a { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--linie); border-left: 4px solid var(--farbe); border-radius: var(--rund-klein, 8px); background: var(--flaeche); color: var(--text); text-decoration: none; font-size: .93rem; max-width: 100%; }
    .zuletzt-liste a:hover { border-color: var(--leise); border-left-color: var(--farbe); }
    .zuletzt-liste a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* Listenansicht */
    .zeilen { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 6px 14px; margin-top: 10px; }
    .zeile-huelle { position: relative; min-width: 0; }
    .zeile { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 2px 10px; align-items: baseline; padding: 9px 48px 9px 12px; border: 1px solid var(--linie); border-radius: var(--rund-klein, 8px); background: var(--flaeche); color: var(--text); text-decoration: none; min-height: 100%; }
    .zeile:hover { border-color: var(--farbe); }
    .zeile i { width: 10px; height: 10px; border-radius: 50%; background: var(--farbe); align-self: center; }
    .zeile b { font-family: var(--technik); font-size: 1.02rem; font-weight: 600; }
    .zeile small { grid-column: 2; color: var(--leise); font-size: .86rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 700px) { .zeile small { display: none; } .zeile { padding-top: 11px; padding-bottom: 11px; } .zeilen { gap: 6px; } }
    .bereich.klappbar { margin-top: 10px; }
    .bereich.klappbar summary { list-style: none; cursor: pointer; }
    .bereich.klappbar summary::-webkit-details-marker { display: none; }
    .bereich.klappbar .bereich-kopf { padding: 10px 2px; }
    .bereich.klappbar .bereich-kopf h2 { font-size: 1.2rem; }
    .bereich.klappbar .bereich-kopf::after { content: ''; width: 9px; height: 9px; border-right: 2px solid var(--leise); border-bottom: 2px solid var(--leise); transform: rotate(45deg); margin: -4px 4px 0 2px; transition: transform .15s; }
    .bereich.klappbar details[open] .bereich-kopf::after { transform: rotate(-135deg); margin-top: 4px; }
    .zeile-huelle .stern { top: 50%; bottom: auto; right: 8px; transform: translateY(-50%); width: 32px; height: 32px; }
    .mehr { display: flex; justify-content: center; margin: 12px 0 0; }
    .mehr button { border: 1px dashed var(--linie); background: none; color: var(--text); border-radius: 999px; padding: 8px 16px; font: inherit; font-family: var(--technik); cursor: pointer; }
    .mehr button:hover { border-style: solid; border-color: var(--farbe); }
    .reiter { display: flex; flex-wrap: wrap; gap: 6px; }
    .reiter button {
      display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--linie);
      background: var(--flaeche); color: var(--text); font-family: var(--technik); font-size: 1rem; cursor: pointer;
    }
    .reiter button:hover { border-color: var(--leise); }
    .reiter button[aria-pressed="true"] { background: var(--text); color: var(--grund); border-color: var(--text); }

    .bereich { margin: 34px 0 0; }
    .bereich-kopf { display: flex; align-items: center; gap: 12px; margin: 0 0 4px; padding-bottom: 8px; border-bottom: 1px solid var(--linie); }

    .raster { grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }

    .karte .stichworte { margin-top: auto; color: var(--leise); font-size: .84rem; padding-right: 40px; }
    .karte-huelle { position: relative; display: flex; min-width: 0; transition: transform .15s; }

    .karte-huelle:hover { transform: translateY(-2px); }

    .stern {
      position: absolute; right: 12px; bottom: 10px; width: 34px; height: 34px; padding: 0; border-radius: 50%;
      border: 1px solid var(--linie); background: var(--flaeche); color: var(--leise); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .reiter .fav-zeichen { color: #D98A0B; font-size: .95rem; line-height: 1; }
    .reiter button[aria-pressed="true"] .fav-zeichen { color: #F2A541; }
    .fav-hinweis { color: var(--leise); margin: 6px 0 0; font-size: .92rem; }

    .leer { color: var(--leise); padding: 20px 0; }
    /* Startseite: kompakter Kopf, Schnellzugriff, Bereichskacheln nach Themenfeldern */
    .start-held { padding-bottom: 0; }
    .start-held h1 { font-size: clamp(1.9rem, 5.2vw, 3.1rem); }
    .start-held > p:not(.kennzahlen) { margin-top: 10px; }
    .kennzahlen { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 12px 0 0; font-family: var(--technik); font-size: .95rem; color: var(--leise); }
    .kennzahlen:empty { display: none; }
    .kennzahlen b { color: var(--text); font-weight: 700; }
    .schnell { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 18px 0 0; }
    .schnell a { display: flex; flex-direction: column; gap: 2px; padding: 11px 14px; border: 1px solid var(--linie); border-radius: var(--rund-klein, 10px); background: var(--flaeche); color: var(--text); text-decoration: none; min-width: 0; transition: border-color .15s, transform .15s; }
    .schnell a:hover { border-color: var(--leise); transform: translateY(-1px); }
    .schnell b { font-family: var(--technik); font-size: 1.02rem; }
    .schnell small { color: var(--leise); font-size: .84rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 700px) { .schnell { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .schnell a { padding: 9px 12px; } }
    .feld-titel { margin: 30px 0 10px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .feld-titel h2 { margin: 0; font-size: 1.35rem; }
    .feld-titel span { color: var(--leise); font-size: .92rem; }
    .kacheln { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); gap: 12px; }
    @media (max-width: 700px) { .kachel-b li:nth-child(3) { display: none; } }
    .kachel-b { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 12px; border: 1px solid var(--linie); border-left: 5px solid var(--farbe); border-radius: var(--rund, 12px); background: var(--flaeche); min-width: 0; }
    .kachel-b:hover { border-color: var(--leise); border-left-color: var(--farbe); }
    .kachel-b > button { all: unset; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; }
    .kachel-b > button:focus-visible { outline: 2px solid var(--farbe); outline-offset: 4px; border-radius: 6px; }
    .kachel-b h3 { margin: 0; font-size: 1.12rem; hyphens: none; -webkit-hyphens: none; overflow-wrap: normal; word-break: normal; }
    .kachel-b .zahl-b { font-family: var(--technik); color: var(--leise); font-size: .88rem; white-space: nowrap; }
    .kachel-b .info-b { grid-column: 1 / -1; color: var(--leise); font-size: .9rem; }
    .kachel-b ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    .kachel-b li a { display: block; padding: 4px 0; color: var(--text); text-decoration: none; font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kachel-b li a::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--farbe); margin: 0 9px 2px 1px; vertical-align: middle; }
    .kachel-b li a:hover { color: var(--farbe); }
    .kachel-b .alle-b { align-self: flex-start; border: 0; background: none; color: var(--farbe); font: inherit; font-family: var(--technik); font-size: .9rem; font-weight: 600; padding: 2px 0; cursor: pointer; }
    .kachel-b .alle-b:hover { text-decoration: underline; }
    .neu-b { font-size: .7rem; font-family: var(--technik); font-weight: 700; color: #fff; background: var(--farbe); border-radius: 999px; padding: 1px 7px; margin-left: 6px; vertical-align: 2px; }
    #reiter { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; padding-bottom: 4px; }
    #reiter button { flex: none; }
  </style>

          <button type="button" data-ansicht="liste" aria-pressed="false" title="Kompakte Liste"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="3" rx="1.5"/><rect x="2" y="8.5" width="16" height="3" rx="1.5"/><rect x="2" y="14" width="16" height="3" rx="1.5"/></svg><span>Liste</span></button>

  <script src="assets/katex/katex.min.js"></script>
  <script>
  (function () {
    'use strict';

    /*
     * Alle Rechner, Formelsammlungen und Simulationen
     * ===============================================
     * Neue Seite: hier einen Eintrag ergänzen, die Übersicht zeigt ihn dann unter seinem Bereich an.
     *
     *   titel    Name auf der Karte
     *   pfad     relativ zu dieser Datei
     *   bereich  Kategorie, wird zur Überschrift und zum Reiter oben
     *   gruppe   Untergruppe im Bereich (darf fehlen)
     *   auchIn   weitere Bereiche, in denen die Karte zusätzlich erscheint (darf fehlen)
     *   themen   Stichwörter für die Suche, die ersten drei stehen auf der Karte
     *   text     ein Satz, was man dort tun kann
     *   tex      eine typische Formel als Erkennungszeichen (LaTeX, darf fehlen)
     */
    const eintraege = [
      // wird von werkzeuge/bauen.js aus daten/seiten/**/*.json gefüllt
    ];

    // Reihenfolge und Farben der Bereiche; Untergruppen in dieser Reihenfolge
    const BEREICHE = { 'Elektrotechnik': '#2B7BB9', 'Gebäudeautomation': '#9333EA', 'Steuerungstechnik': '#0E7C86', 'IT und Netzwerk': '#3B5BDB', 'Heizungstechnik': '#C2410C', 'Sanitärtechnik': '#0E6B6A', 'Dach und Klempnerei': '#A0785A', 'Mathematik': '#5C940D', 'Physik': '#C2255C', 'Mechanik': '#6E6FA6', 'Brandschutz': '#E4572E', 'Arbeitsschutz': '#2F9E44', 'Geld und Kalkulation': '#A16207', 'Werkzeuge': '#6B7785' };
    // Themenfelder der Übersicht: Name, Untertitel, Bereiche; nicht genannte Bereiche landen unter „Weitere“
    const FELDER = [
      ['Elektro und Automation', 'Installation, Schutz, Energie, Netzwerk', ['Elektrotechnik', 'Gebäudeautomation', 'Steuerungstechnik', 'IT und Netzwerk']],
      ['Haustechnik und Bau', 'Heizung, Wasser, Dach', ['Heizungstechnik', 'Sanitärtechnik', 'Dach und Klempnerei']],
      ['Grundlagen', 'Rechnen, Physik, Kräfte', ['Mathematik', 'Physik', 'Mechanik']],
      ['Sicherheit und Betrieb', 'Brand- und Arbeitsschutz, Kalkulation, Werkzeuge', ['Brandschutz', 'Arbeitsschutz', 'Geld und Kalkulation', 'Werkzeuge']]
    ];
    const INFO = {
      'Elektrotechnik': 'Leitungen, Schutzmaßnahmen, PV, Speicher und Maschinen',
      'Gebäudeautomation': 'Bussysteme planen, programmieren und simulieren',
      'Steuerungstechnik': 'SPS, Logikmodule und Digitaltechnik',
      'IT und Netzwerk': 'Subnetze, Datenraten, WLAN, Speicher und Sicherheit',
      'Heizungstechnik': 'Heizlast, Abgleich, Wärmepumpe und Abgas',
      'Sanitärtechnik': 'Trinkwasser, Abwasser, Gas und Regenwasser',
      'Dach und Klempnerei': 'Sparren, Rinnen, Verwahrungen, Wind und Schnee',
      'Mathematik': 'Brüche, Kommaverschiebung, Dezimalzahlen und Einheiten',
      'Physik': 'Wärme, Optik, Atome, Sterne und Kosmos',
      'Mechanik': 'Kräfte, Hebel, Schrauben und Bewegung',
      'Brandschutz': 'Brandmelder, Fluchtwege, Löscher und Brandverlauf',
      'Arbeitsschutz': 'Lasten, Lärm, Klima, Leitern und Gefahrstoffe',
      'Geld und Kalkulation': 'Stundensatz, Angebot, Kredit und Amortisation',
      'Werkzeuge': 'Projektmappe, Prüfprotokolle, Simulatoren und Planer'
    };
    const GRUPPEN = ['Grundlagen', 'Installation und Schutz', 'Energie und Photovoltaik'];
    const NEU = ['Mathematik'];
    const farbe = function (b) { return BEREICHE[b] || 'var(--leise)'; };

    // Gehört ein Eintrag zu einem Bereich (eigener Bereich oder zusätzlich über auchIn)?
    function imBereich(e, b) { return e.bereich === b || (e.auchIn || []).indexOf(b) >= 0; }
    // Untergruppe nur im eigenen Bereich; in weiteren Bereichen ohne Untergruppe
    function gruppeIn(e, b) { return e.bereich === b ? (e.gruppe || '') : ''; }
    const bereiche = [];
    Object.keys(BEREICHE).concat(eintraege.map(function (e) { return e.bereich; })).forEach(function (b) {
      if (bereiche.indexOf(b) < 0 && eintraege.some(function (e) { return imBereich(e, b); })) bereiche.push(b);
    });

    // Favoriten: Pfade aus basis.js, nur solche, die es (noch) gibt; in der Reihenfolge des Merkens
    const FAV = '\u2605';   // eigener Reiter-Wert für „Favoriten“
    const FAV_AUSWAHL = 'uebersicht-auswahl';
    function favoriten() {
      const liste = window.Favoriten ? window.Favoriten.liste() : [];
      return liste.map(function (p) { return eintraege.filter(function (e) { return e.pfad === p; })[0]; }).filter(Boolean);
    }
    function istFavorit(e) { return !!window.Favoriten && window.Favoriten.ist(e.pfad); }

    // Darstellung: große Karten oder kompakte Liste; ohne eigene Wahl auf dem Handy die Liste
    const ANSICHT = 'uebersicht-ansicht';
    let ansicht = '';
    try { ansicht = localStorage.getItem(ANSICHT) || ''; } catch (x) { /* ohne Speicher */ }
    if (ansicht !== 'karten' && ansicht !== 'liste') ansicht = window.matchMedia && window.matchMedia('(max-width: 700px)').matches ? 'liste' : 'karten';
    const ansichtKnoepfe = Array.prototype.slice.call(document.querySelectorAll('[data-ansicht]'));
    function ansichtZeigen() { ansichtKnoepfe.forEach(function (k) { k.setAttribute('aria-pressed', String(k.getAttribute('data-ansicht') === ansicht)); }); }
    ansichtKnoepfe.forEach(function (k) {
      k.addEventListener('click', function () {
        ansicht = k.getAttribute('data-ansicht') === 'liste' ? 'liste' : 'karten';
        try { localStorage.setItem(ANSICHT, ansicht); } catch (x) { /* ohne Speicher */ }
        ansichtZeigen(); zeigen();
      });
    });
    ansichtZeigen();
    // Schatten unter der Suchleiste, sobald sie oben klebt
    const leiste = document.getElementById('bereiche');
    const kleben = function () { leiste.classList.toggle('klebt', leiste.getBoundingClientRect().top <= 0.5 && window.scrollY > 40); };
    window.addEventListener('scroll', kleben, { passive: true });

    let auswahl = '';
    try { if (sessionStorage.getItem(FAV_AUSWAHL) === FAV) auswahl = FAV; } catch (x) { /* ohne Speicher */ }
    // Kennzahlen im Kopf (nur Zahlen, daher innerHTML unbedenklich)
    document.getElementById('kennzahlen').innerHTML = '<span><b>' + eintraege.length + '</b> Seiten</span><span><b>' + bereiche.length + '</b> Bereiche</span><span><b>' + FELDER.length + '</b> Themenfelder</span><span>läuft offline</span>';
    const reiter = document.getElementById('reiter');
    function reiterBauen() {
      reiter.innerHTML = '';
      [''].concat([FAV], bereiche).forEach(function (b) {
        const k = document.createElement('button');
        k.type = 'button';
        k.style.setProperty('--farbe', b && b !== FAV ? farbe(b) : 'var(--leise)');
        const anzahl = b === FAV ? favoriten().length : b ? eintraege.filter(function (e) { return imBereich(e, b); }).length : eintraege.length;
        k.innerHTML = (b === FAV ? '<b class="fav-zeichen" aria-hidden="true">\u2605</b>' : b ? '<i aria-hidden="true"></i>' : '') + '<span></span> <small>' + anzahl + '</small>';
        k.querySelector('span').textContent = b === FAV ? 'Favoriten' : b || 'Alle';
        k.setAttribute('aria-pressed', String(b === auswahl));
        k.addEventListener('click', function () { waehle(b, true); });
        reiter.append(k);
      });
    }
    reiterBauen();

    document.getElementById('suchfeld').addEventListener('input', zeigen);

    function passt(e) {
      const suche = document.getElementById('suchfeld').value.trim().toLowerCase();
      const alles = [e.titel, e.text, e.bereich, e.gruppe || ''].concat(e.auchIn || []).concat(e.themen).join(' ').toLowerCase();
      return (!auswahl || (auswahl === FAV ? istFavorit(e) : imBereich(e, auswahl))) && (!suche || suche.split(/\s+/).every(function (w) { return alles.indexOf(w) >= 0; }));
    }

    function stern(e) {
      const st = document.createElement('button');
      st.type = 'button';
      st.className = 'stern';
      st.setAttribute('data-pfad', e.pfad);
      st.innerHTML = window.Favoriten ? window.Favoriten.stern : '\u2605';
      const an = istFavorit(e);
      st.setAttribute('aria-pressed', String(an));
      st.setAttribute('aria-label', (an ? 'Aus den Favoriten entfernen: ' : 'Zu den Favoriten: ') + e.titel);
      st.title = an ? 'Aus den Favoriten entfernen' : 'Als Favorit merken';
      st.addEventListener('click', function () { if (window.Favoriten) window.Favoriten.umschalten(e.pfad); });
      return st;
    }
    function zeile(e) {
      const a = document.createElement('a');
      a.className = 'zeile'; a.href = e.pfad; a.style.setProperty('--farbe', farbe(e.bereich));
      const i = document.createElement('i'); i.setAttribute('aria-hidden', 'true');
      const b = document.createElement('b'); b.textContent = e.titel;
      const k = document.createElement('small'); k.textContent = e.text;
      a.append(i, b, k);
      const huelle = document.createElement('div'); huelle.className = 'zeile-huelle';
      huelle.append(a, stern(e));
      return huelle;
    }
    // Behälter je nach Darstellung
    function behaelter() { const d = document.createElement('div'); d.className = ansicht === 'liste' ? 'zeilen' : 'raster'; return d; }
    function eintrag(e) { return ansicht === 'liste' ? zeile(e) : karte(e); }

    function karte(e) {
      const a = document.createElement('a');
      a.className = 'karte';
      a.href = e.pfad;
      a.style.setProperty('--farbe', farbe(e.bereich));
      if (e.tex) {
        const bild = document.createElement('div');
        bild.className = 'formelbild';
        Formel.setze(bild, e.tex, true);
        a.append(bild);
      }
      const h = document.createElement('h3'); h.textContent = e.titel;
      const p = document.createElement('p'); p.textContent = e.text;
      const w = document.createElement('div'); w.className = 'stichworte'; w.textContent = e.themen.slice(0, 3).join(' · ');
      a.append(h, p, w);
      const huelle = document.createElement('div');
      huelle.className = 'karte-huelle';
      huelle.append(a, stern(e));
      return huelle;
    }

    // Nach jeder Änderung (auch aus einem anderen Tab) neu zeichnen; der Fokus bleibt auf dem Stern
    document.addEventListener('favoritenwechsel', function () {
      const fokus = document.activeElement && document.activeElement.getAttribute ? document.activeElement.getAttribute('data-pfad') : null;
      const imBereichFokus = document.activeElement && document.activeElement.closest ? document.activeElement.closest('section.bereich') : null;
      const favAbschnitt = !!(imBereichFokus && imBereichFokus.classList.contains('favoriten'));
      reiterBauen();
      zeigen();
      if (fokus) {
        const alle = Array.prototype.slice.call(document.querySelectorAll('.stern'));
        const ziel = alle.filter(function (k) { return k.getAttribute('data-pfad') === fokus && !!k.closest('section.favoriten') === favAbschnitt; })[0] ||
          alle.filter(function (k) { return k.getAttribute('data-pfad') === fokus; })[0];
        if (ziel) ziel.focus(); else if (reiter.querySelector('[aria-pressed="true"]')) reiter.querySelector('[aria-pressed="true"]').focus();
      }
    });

    function abschnittBauen(titel, f, liste, klasse) {
      const abschnitt = document.createElement('section');
      abschnitt.className = 'bereich' + (klasse ? ' ' + klasse : '');
      abschnitt.style.setProperty('--farbe', f);
      const kopf = document.createElement('div');
      kopf.className = 'bereich-kopf';
      kopf.innerHTML = '<i aria-hidden="true"></i><h2></h2><span></span>';
      kopf.querySelector('h2').textContent = titel;
      kopf.querySelector('span').textContent = liste.length + (liste.length === 1 ? ' Seite' : ' Seiten');
      abschnitt.append(kopf);
      return abschnitt;
    }
    function favoritenZeigen(ziel, mitHinweis) {
      const liste = favoriten().filter(passt);
      if (!liste.length) return false;
      const abschnitt = abschnittBauen('Favoriten', '#F2A541', liste, 'favoriten');
      const raster = behaelter();
      raster.style.marginTop = '14px';
      liste.forEach(function (e) { raster.append(eintrag(e)); });
      abschnitt.append(raster);
      if (mitHinweis) { const t = document.createElement('p'); t.className = 'fav-hinweis'; t.textContent = 'Nur in diesem Browser gespeichert. Stern antippen, um eine Seite zu entfernen.'; abschnitt.append(t); }
      ziel.append(abschnitt);
      return true;
    }

    const schmal = function () { return !!(window.matchMedia && window.matchMedia('(max-width: 700px)').matches); };
    let offen = [];
    try { const o = JSON.parse(sessionStorage.getItem('uebersicht-offen') || '[]'); if (Array.isArray(o)) offen = o.filter(function (x) { return typeof x === 'string'; }).slice(0, 30); } catch (x) { offen = []; }
    const VORSCHAU = window.matchMedia && window.matchMedia('(max-width: 700px)').matches ? 2 : 4;
    function zuletztZeigen(ziel) {
      const liste = (window.Zuletzt ? window.Zuletzt.liste() : []).map(function (p) { return eintraege.filter(function (e) { return e.pfad === p; })[0]; }).filter(Boolean).slice(0, 6);
      if (!liste.length) return;
      const ab = document.createElement('section'); ab.className = 'zuletzt'; ab.setAttribute('aria-label', 'Zuletzt geöffnet');
      const h = document.createElement('h2'); h.textContent = 'Zuletzt geöffnet';
      const l = document.createElement('div'); l.className = 'zuletzt-liste';
      liste.forEach(function (e) { const a = document.createElement('a'); a.href = e.pfad; a.style.setProperty('--farbe', farbe(e.bereich)); const sp = document.createElement('span'); sp.textContent = e.titel; a.append(sp); l.append(a); });
      ab.append(h, l); ziel.append(ab);
    }
    // Bereich wählen: Reiter, Adresse (#bereich=…) und Ansicht nachziehen
    function waehle(b, scrollen) {
      auswahl = b;
      try { sessionStorage.setItem(FAV_AUSWAHL, auswahl === FAV ? FAV : ''); } catch (x) { /* ohne Speicher */ }
      try { if (history.replaceState) history.replaceState(null, '', location.pathname + location.search + (b && b !== FAV ? '#bereich=' + encodeURIComponent(b) : '')); } catch (x) { /* egal */ }
      reiterBauen(); zeigen();
      const aktiv = reiter.querySelector('[aria-pressed="true"]');
      if (aktiv && aktiv.scrollIntoView) { try { aktiv.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (x) { /* alt */ } }
      if (scrollen) { const y = document.getElementById('liste').getBoundingClientRect().top + window.scrollY - leiste.offsetHeight - 8; if (window.scrollY > y || scrollen === 'immer') window.scrollTo(0, Math.max(0, y)); }
    }
    function ausAdresse() {
      const m = /^#bereich=([^&]+)/.exec(location.hash);
      if (!m) return false;
      let b = ''; try { b = decodeURIComponent(m[1]); } catch (x) { b = ''; }
      if (bereiche.indexOf(b) < 0) return false;
      auswahl = b; return true;
    }
    function kachelnZeigen(ziel) {
      const felder = FELDER.map(function (f) { return [f[0], f[1], f[2].filter(function (b) { return bereiche.indexOf(b) >= 0; })]; });
      const genannt = [].concat.apply([], felder.map(function (f) { return f[2]; }));
      const rest = bereiche.filter(function (b) { return genannt.indexOf(b) < 0; });
      if (rest.length) felder.push(['Weitere', '', rest]);
      felder.forEach(function (f) {
        if (!f[2].length) return;
        const kopf = document.createElement('div'); kopf.className = 'feld-titel';
        const h = document.createElement('h2'); h.textContent = f[0];
        const u = document.createElement('span'); u.textContent = f[1];
        kopf.append(h, u); ziel.append(kopf);
        const raster = document.createElement('div'); raster.className = 'kacheln';
        f[2].forEach(function (b) {
          const liste = eintraege.filter(function (e) { return imBereich(e, b); });
          const k = document.createElement('section'); k.className = 'kachel-b'; k.style.setProperty('--farbe', farbe(b));
          const knopf = document.createElement('button'); knopf.type = 'button'; knopf.title = 'Alle Seiten in ' + b + ' zeigen';
          const h3 = document.createElement('h3'); h3.textContent = b;
          if (NEU.indexOf(b) >= 0) { const n = document.createElement('span'); n.className = 'neu-b'; n.textContent = 'neu'; h3.append(n); }
          const z = document.createElement('span'); z.className = 'zahl-b'; z.textContent = liste.length + (liste.length === 1 ? ' Seite' : ' Seiten');
          const i = document.createElement('span'); i.className = 'info-b'; i.textContent = INFO[b] || '';
          knopf.append(h3, z, i);
          knopf.addEventListener('click', function () { waehle(b, 'immer'); });
          const ul = document.createElement('ul');
          liste.slice(0, 3).forEach(function (e) { const li = document.createElement('li'), a = document.createElement('a'); a.href = e.pfad; a.textContent = e.titel; a.title = e.text; li.append(a); ul.append(li); });
          k.append(knopf, ul);
          if (liste.length > 3) { const alle = document.createElement('button'); alle.type = 'button'; alle.className = 'alle-b'; alle.textContent = 'Alle ' + liste.length + ' zeigen →'; alle.addEventListener('click', function () { waehle(b, 'immer'); }); k.append(alle); }
          raster.append(k);
        });
        ziel.append(raster);
      });
    }
    function zeigen() {
      const ziel = document.getElementById('liste');
      ziel.innerHTML = '';
      const suche = document.getElementById('suchfeld').value.trim();
      if (auswahl === FAV) {
        if (!favoritenZeigen(ziel, true)) {
          ziel.innerHTML = favoriten().length
            ? '<p class="leer">Keiner deiner Favoriten passt zur Suche.</p>'
            : '<p class="leer">Noch keine Favoriten. Tippe auf den Stern unten rechts an einer Karte oder oben auf einer Seite, um sie hier zu sammeln.</p>';
        }
        return;
      }
      const treffer = eintraege.filter(passt);
      if (!treffer.length) {
        ziel.innerHTML = '<p class="leer">Nichts gefunden. Anderen Begriff versuchen oder „Alle“ wählen.</p>';
        return;
      }
      const uebersicht = !auswahl && !suche;
      // Übersicht: zuletzt geöffnet, Favoriten, dann alle Bereiche als Kacheln nach Themenfeldern
      if (uebersicht) { zuletztZeigen(ziel); favoritenZeigen(ziel, false); kachelnZeigen(ziel); return; }
      bereiche.forEach(function (b) {
        if (auswahl && b !== auswahl) return;   // gewählter Reiter: nur dieser Bereich
        const liste = treffer.filter(function (e) { return imBereich(e, b); });
        if (!liste.length) return;
        const abschnitt = abschnittBauen(b, farbe(b), liste);
        // Untergruppen, falls vorhanden; sonst ein Raster
        const gruppen = [];
        GRUPPEN.concat(liste.map(function (e) { return gruppeIn(e, b); })).forEach(function (gr) {
          if (gruppen.indexOf(gr) < 0 && liste.some(function (e) { return gruppeIn(e, b) === gr; })) gruppen.push(gr);
        });
        // Übersicht mit Karten: je Bereich nur eine Vorschau, der Rest über „Alle zeigen“
        if (uebersicht && ansicht === 'karten' && liste.length > VORSCHAU) {
          const raster = behaelter(); raster.style.marginTop = '14px';
          gruppen.forEach(function (gr) { liste.filter(function (e) { return gruppeIn(e, b) === gr; }).forEach(function (e) { if (raster.childNodes.length < VORSCHAU) raster.append(eintrag(e)); }); });
          abschnitt.append(raster);
          const mehr = document.createElement('div'), k = document.createElement('button');
          mehr.className = 'mehr'; k.type = 'button'; k.textContent = 'Alle ' + liste.length + ' Seiten in ' + b + ' zeigen';
          k.addEventListener('click', function () { waehle(b, 'immer'); });
          mehr.append(k); abschnitt.append(mehr);
          ziel.append(abschnitt);
          return;
        }
        gruppen.forEach(function (gr) {
          if (gr && gruppen.length > 1) {
            const t = document.createElement('div'); t.className = 'gruppe-titel'; t.textContent = gr;
            abschnitt.append(t);
          }
          const raster = behaelter();
          liste.filter(function (e) { return gruppeIn(e, b) === gr; }).forEach(function (e) { raster.append(eintrag(e)); });
          abschnitt.append(raster);
        });
        // Handy, Liste, Übersicht: Bereiche zum Aufklappen, damit die Seite kurz bleibt
        if (uebersicht && ansicht === 'liste' && schmal()) {
          const kopf = abschnitt.firstChild, det = document.createElement('details'), sum = document.createElement('summary');
          det.open = offen.indexOf(b) >= 0;
          det.addEventListener('toggle', function () { offen = offen.filter(function (x) { return x !== b; }); if (det.open) offen.push(b); try { sessionStorage.setItem('uebersicht-offen', JSON.stringify(offen)); } catch (x) { /* egal */ } });
          sum.append(kopf);
          while (abschnitt.firstChild) det.append(abschnitt.firstChild);
          det.insertBefore(sum, det.firstChild);
          abschnitt.append(det); abschnitt.classList.add('klappbar');
        }
        ziel.append(abschnitt);
      });
    }
    ausAdresse(); reiterBauen();
    zeigen();
    window.addEventListener('hashchange', function () { if (ausAdresse()) { reiterBauen(); zeigen(); } else if (location.hash === '#bereiche' && auswahl && auswahl !== FAV) { auswahl = ''; reiterBauen(); zeigen(); } });
  })();
  </script>
</body>
</html>
