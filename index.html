  <style>

    .werkzeug.klebt { box-shadow: 0 10px 12px -12px rgba(0, 0, 0, .35); }
    .such-zeile { display: flex; gap: 10px; align-items: center; }
    .werkzeug input {
      flex: 1 1 auto; min-width: 0; padding: 11px 16px; border: 1px solid var(--linie); border-radius: 999px; background: var(--flaeche); font-size: 1.02rem;
    }
    .ansicht { display: inline-flex; border: 1px solid var(--linie); border-radius: 999px; padding: 3px; background: var(--flaeche); flex: none; }
    .ansicht button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--leise); padding: 7px 12px; border-radius: 999px; cursor: pointer; font: inherit; font-family: var(--technik); font-size: .92rem; }
    .ansicht button svg { width: 16px; height: 16px; fill: currentColor; }
    .ansicht button[aria-pressed="true"] { background: var(--text); color: var(--grund); }
    @media (max-width: 560px) { .ansicht button span { display: none; } .ansicht button { padding: 8px 10px; } }
    .zuletzt { margin: 20px 0 0; }
    .zuletzt h2 { font-size: 1rem; font-family: var(--technik); color: var(--leise); margin: 0 0 8px; font-weight: 600; }
    .zuletzt-liste { display: flex; flex-wrap: wrap; gap: 8px; }

    .zuletzt-liste a:hover { border-color: var(--leise); border-left-color: var(--farbe); }
    .zuletzt-liste a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* Listenansicht */
    .zeilen { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 6px 14px; margin-top: 10px; }
    .zeile-huelle { position: relative; min-width: 0; }
    .zeile { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 2px 10px; align-items: baseline; padding: 9px 48px 9px 12px; border: 1px solid var(--linie); border-radius: var(--rund-klein, 8px); background: var(--flaeche); color: var(--text); text-decoration: none; min-height: 100%; }
    .zeile:hover { border-color: var(--farbe); }
    .zeile i { width: 10px; height: 10px; border-radius: 50%; background: var(--farbe); align-self: center; }
    .zeile b { font-family: var(--technik); font-size: 1.02rem; font-weight: 600; }
    .zeile small { grid-column: 2; color: var(--leise); font-size: .86rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 700px) { .zeile small { display: none; } .zeile { padding-top: 11px; padding-bottom: 11px; } .zeilen { gap: 6px; } }
    .zeile-huelle .stern { top: 50%; bottom: auto; right: 8px; transform: translateY(-50%); width: 32px; height: 32px; }
    .mehr { display: flex; justify-content: center; margin: 12px 0 0; }
    .mehr button { border: 1px dashed var(--linie); background: none; color: var(--text); border-radius: 999px; padding: 8px 16px; font: inherit; font-family: var(--technik); cursor: pointer; }
    .mehr button:hover { border-style: solid; border-color: var(--farbe); }
    .reiter { display: flex; flex-wrap: wrap; gap: 6px; }
    .reiter button {
      display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--linie);
      background: var(--flaeche); color: var(--text); font-family: var(--technik); font-size: 1rem; cursor: pointer;
    }
    .reiter button:hover { border-color: var(--leise); }
    .reiter button[aria-pressed="true"] { background: var(--text); color: var(--grund); border-color: var(--text); }
    .reiter i { width: 10px; height: 10px; border-radius: 50%; background: var(--farbe, var(--leise)); }
    .reiter small { color: inherit; opacity: .65; font-size: .85rem; }

    .bereich { margin: 34px 0 0; }
    .bereich-kopf { display: flex; align-items: center; gap: 12px; margin: 0 0 4px; padding-bottom: 10px; border-bottom: 1px solid var(--linie); }
    .bereich-titel { min-width: 0; }
    .bereich-titel p { margin: 2px 0 0; color: var(--leise); font-size: .92rem; }
    .bereich-kopf i { width: 14px; height: 14px; border-radius: 4px; background: var(--farbe); flex: none; }
    .bereich-kopf h2 { margin: 0; font-size: 1.55rem; }
    .bereich-kopf .anzahl { color: var(--leise); margin-left: auto; font-size: .92rem; white-space: nowrap; align-self: flex-start; padding-top: 6px; }
    .gruppe-titel { margin: 18px 0 10px; font-family: var(--technik); font-weight: 600; font-size: 1rem; color: var(--leise); letter-spacing: .02em; }

    .raster { grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
    .karte { gap: 8px; border-top: 4px solid var(--farbe); }
    .karte .formelbild { min-height: 54px; font-size: 1.05rem; padding: 10px; }
    .karte h3 { font-size: 1.25rem; }
    .karte p { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-size: .92rem; }
    .karte .stichworte { margin-top: auto; color: var(--leise); font-size: .84rem; padding-right: 40px; }
    .karte-huelle { position: relative; display: flex; min-width: 0; transition: transform .15s; }
    .karte-huelle > .karte { flex: 1 1 auto; min-width: 0; }
    .karte-huelle:hover { transform: translateY(-2px); }
    .karte-huelle > .karte:hover { transform: none; }
    .stern {
      position: absolute; right: 12px; bottom: 10px; width: 34px; height: 34px; padding: 0; border-radius: 50%;
      border: 1px solid var(--linie); background: var(--flaeche); color: var(--leise); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .reiter .fav-zeichen { color: #D98A0B; font-size: .95rem; line-height: 1; }
    .reiter button[aria-pressed="true"] .fav-zeichen { color: #F2A541; }
    .fav-hinweis { color: var(--leise); margin: 6px 0 0; font-size: .92rem; }

    .leer { color: var(--leise); padding: 20px 0; }
    /* Startseite: kompakter Kopf, Schnellzugriff, Bereichskacheln nach Themenfeldern */
    .start-held { padding-bottom: 0; }
    .start-held h1 { font-size: clamp(1.9rem, 5.2vw, 3.1rem); }
    .start-held > p:not(.kennzahlen) { margin-top: 10px; }
    .kennzahlen { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 12px 0 0; font-family: var(--technik); font-size: .95rem; color: var(--leise); }
    .kennzahlen:empty { display: none; }
    .kennzahlen b { color: var(--text); font-weight: 700; }
    .schnell { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 18px 0 0; }
    .schnell a { display: flex; flex-direction: column; gap: 2px; padding: 11px 14px; border: 1px solid var(--linie); border-radius: var(--rund-klein, 10px); background: var(--flaeche); color: var(--text); text-decoration: none; min-width: 0; transition: border-color .15s, transform .15s; }
    .schnell a:hover { border-color: var(--leise); transform: translateY(-1px); }
    .schnell b { font-family: var(--technik); font-size: 1.02rem; }
    .schnell small { color: var(--leise); font-size: .84rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 700px) { .schnell { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .schnell a { padding: 9px 12px; } }
    .feld-b { margin: 28px 0 0; }
    .feld-titel { margin: 0 0 12px; display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; padding-left: 12px; border-left: 4px solid var(--farbe); }
    .feld-titel h2 { margin: 0; font-size: 1.4rem; }
    .feld-titel h2 button { all: unset; cursor: pointer; }
    .feld-titel h2 button:hover { color: var(--farbe); }
    .feld-titel h2 button:focus-visible { outline: 2px solid var(--farbe); outline-offset: 3px; border-radius: 4px; }
    .feld-titel span { color: var(--leise); font-size: .92rem; }
    .kacheln { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); gap: 12px; }
    .kachel-b { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border: 1px solid var(--linie); border-radius: var(--rund, 12px); background: var(--flaeche); background: linear-gradient(180deg, color-mix(in srgb, var(--farbe) 7%, var(--flaeche)) 0, var(--flaeche) 64px); min-width: 0; box-shadow: inset 0 3px 0 var(--farbe); transition: border-color .15s, transform .15s; }
    .kachel-b:hover { border-color: color-mix(in srgb, var(--farbe) 45%, var(--linie)); transform: translateY(-1px); }
    .kachel-b > button { all: unset; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; }
    .kachel-b > button:focus-visible { outline: 2px solid var(--farbe); outline-offset: 4px; border-radius: 6px; }
    .kachel-b > button:hover h3 { color: var(--farbe); }
    .kachel-b h3 { margin: 0; font-size: 1.12rem; hyphens: none; -webkit-hyphens: none; overflow-wrap: normal; word-break: normal; }
    .kachel-b .zahl-b { font-family: var(--technik); color: var(--leise); font-size: .85rem; white-space: nowrap; }
    .kachel-b .info-b { grid-column: 1 / -1; color: var(--leise); font-size: .88rem; }
    .unter-b { display: flex; flex-wrap: wrap; gap: 6px; }
    .unter-b button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid color-mix(in srgb, var(--farbe) 30%, var(--linie)); background: color-mix(in srgb, var(--farbe) 8%, var(--flaeche)); color: var(--text); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: .86rem; cursor: pointer; }
    .unter-b button:hover { border-color: var(--farbe); }
    .unter-b small, .begriffe small { color: var(--leise); font-family: var(--technik); font-size: .78rem; }
    .kachel-b ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
    .kachel-b li a { display: block; padding: 3px 0; color: var(--text); text-decoration: none; font-size: .93rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kachel-b li a::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--farbe); margin: 0 9px 2px 1px; vertical-align: middle; }
    .kachel-b li a:hover { color: var(--farbe); }
    .neu-b { font-size: .7rem; font-family: var(--technik); font-weight: 700; color: #fff; background: var(--farbe); border-radius: 999px; padding: 1px 7px; margin-left: 6px; vertical-align: 2px; }
    /* Navigation in zwei Ebenen: Themenfelder, darunter die Bereiche des Felds; je eine wischbare Zeile */
    .werkzeug .reiter { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; margin: 0 -4px; padding: 0 4px 2px; -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 24px), transparent 100%); mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 24px), transparent 100%); }
    .werkzeug .reiter::-webkit-scrollbar { display: none; }
    .werkzeug .reiter button { flex: none; }
    .ebene1 { gap: 4px; padding: 4px !important; border: 1px solid var(--linie); border-radius: 999px; background: var(--flaeche); -webkit-mask-image: none !important; mask-image: none !important; margin: 0 !important; }
    .ebene1 button { border: 0 !important; background: none !important; padding: 7px 14px; }
    .ebene1 button:hover { background: var(--grund) !important; }
    .ebene1 button[aria-pressed="true"] { background: var(--text) !important; color: var(--grund); }
    .ebene2 { gap: 6px; }
    .ebene2 button { padding: 5px 12px; font-size: .93rem; }
    .ebene2[hidden] { display: none; }
    @media (max-width: 700px) { .ebene1 button { padding: 6px 11px; font-size: .95rem; } }
    /* Pfadleiste */
    .pfad { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 14px 0 0; font-family: var(--technik); font-size: .92rem; color: var(--leise); }
    .pfad button { border: 0; background: none; padding: 2px 0; color: var(--leise); font: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: var(--linie); text-underline-offset: 3px; }
    .pfad button:hover { color: var(--text); }
    .pfad b { color: var(--text); font-weight: 600; }
    .pfad .trenner { opacity: .6; }
    .unter-reiter { margin: 12px 0 4px; }
    @media (max-width: 700px) { .unter-reiter { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: -18px; padding-right: 18px; } .unter-reiter::-webkit-scrollbar { display: none; } .unter-reiter button { flex: none; } .bereich-kopf .bereich-titel p { font-size: .86rem; } }
    .unter-reiter button { padding: 5px 12px; font-size: .93rem; }
    .karte .ort { font-family: var(--technik); font-size: .78rem; letter-spacing: .02em; color: var(--farbe); font-weight: 600; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* Suche: Seiten zuerst, Begriffe und Stellen als Nebenantworten */
    .such-kopf { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 18px 0 8px; }
    .such-kopf h2 { margin: 0; font-size: 1.3rem; }
    .such-kopf .umfang { color: var(--leise); font-size: .92rem; }
    .such-kopf button, .stellen-kopf button { border: 0; background: none; padding: 0; color: var(--text); font: inherit; font-size: .92rem; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .neben-titel { font-family: var(--technik); font-size: .8rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--leise); margin: 0; }
    .begriffe { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 0 14px; padding-bottom: 2px; }
    .begriffe::-webkit-scrollbar { display: none; }
    .begriffe .neben-titel { flex: none; margin-right: 4px; }
    .begriffe button { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px dashed var(--linie); background: none; color: var(--text); border-radius: 999px; padding: 4px 11px; font: inherit; font-size: .88rem; cursor: pointer; }
    .begriffe button:hover { border-style: solid; border-color: var(--leise); }
    .stellen { margin: 28px 0 0; padding: 14px 16px; border: 1px solid var(--linie); border-radius: var(--rund, 12px); background: var(--flaeche); }
    .stellen-kopf { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; margin-bottom: 8px; }
    .stellen ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: 2px 18px; }
    .stellen a { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 10px; align-items: baseline; padding: 7px 4px; border-bottom: 1px solid var(--linie); color: var(--text); text-decoration: none; }
    .stellen a:hover .stelle { color: var(--farbe); }
    .stellen .art { font-family: var(--technik); font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--farbe); min-width: 74px; }
    .stellen .stelle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .95rem; }
    .stellen small { grid-column: 2; color: var(--leise); font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 700px) { .stellen .art { min-width: 0; } .stellen { padding: 12px; } }
  </style>
</head>

        umfang.forEach(function (e) { nachPfad[e.pfad] = e; });
        const r = window.Suche.treffer(q), punkte = {};
        // Reihenfolge: Titel und Stichwörter zählen doppelt, dazu die Güte aus dem Index (Synonyme, Inhalt)
        wert.forEach(function (x) { punkte[x[1].pfad] = 2 * x[0]; });
        r.forEach(function (t) { if (nachPfad[t.pfad]) punkte[t.pfad] = (punkte[t.pfad] || 0) + t.punkte; });
        seiten = Object.keys(punkte).sort(function (a, b) { return punkte[b] - punkte[a]; }).map(function (p) { return nachPfad[p]; });
        r.forEach(function (t) {
          const blatt = t.pfad.indexOf('lernen.html#blatt=') === 0;
          if (blatt ? feld : !nachPfad[t.pfad]) return;
          if (blatt) stellen.push({ text: t.titel, art: 'Aufgabenblatt', href: t.href, seite: 'Lernen', farbe: farbe(t.bereich) });
          else t.teile.forEach(function (s) { stellen.push({ text: s.text, art: s.art, href: s.href, seite: t.titel, farbe: farbe(t.bereich) }); });
        });
        stellen = stellen.slice(0, 12);
      } else indexHolen();

      const kopf = knoten('div', 'such-kopf');
      const h = knoten('h2', '', seiten.length ? seitenText(seiten.length) + ' zu „' + q + '“' : 'Keine Seite zu „' + q + '“');
      kopf.append(h);
      if (feld) {
        const u = knoten('span', 'umfang', 'in ' + umfangName());
        const alle = knoten('button', '', 'überall suchen'); alle.type = 'button';
        alle.addEventListener('click', function () { setze('', '', '', false); });
        kopf.append(u, alle);
      }
      ziel.append(kopf);
      // Nebenantwort 1: Begriffe zum Eingrenzen (eine Zeile)
      const bg = begriffe(q, umfang);
      if (bg.length) {
        const z = knoten('div', 'begriffe'); z.setAttribute('aria-label', 'Passende Begriffe');
        z.append(knoten('span', 'neben-titel', 'Begriffe'));
        bg.forEach(function (b) {
          const c = knoten('button', '', b[0]); c.type = 'button';
          if (b[1] > 1) c.append(knoten('small', '', String(b[1])));
          c.addEventListener('click', function () { suchfeld.value = b[0]; zeigen(); suchfeld.focus(); });
          z.append(c);
        });
        ziel.append(z);
      }
      // Hauptantwort: die Seiten
      if (seiten.length) {
        const raster = behaelter(); raster.classList.add('treffer-seiten');
        const grenze = alleTreffer || seiten.length <= ERSTE + 2 ? seiten.length : ERSTE;
        seiten.slice(0, grenze).forEach(function (e) { raster.append(eintrag(e)); });
        ziel.append(raster);
        if (grenze < seiten.length) {
          const m = knoten('div', 'mehr'), k = knoten('button', '', 'Alle ' + seiten.length + ' Seiten zeigen'); k.type = 'button';
          k.addEventListener('click', function () { alleTreffer = true; zeigen(); });
          m.append(k); ziel.append(m);
        }
      } else ziel.append(knoten('p', 'leer', indexStand === 'laedt' ? 'Suche auch in den Inhalten der Seiten …' : 'Nichts gefunden. Anderes oder kürzeres Wort versuchen' + (feld ? ' oder überall suchen.' : '.')));
      // Nebenantwort 2: Stellen in den Seiten (Abschnitte, Formeln, Fragen, Aufgabenblätter)
      if (stellen.length) {
        const sek = knoten('section', 'stellen');
        const t = knoten('div', 'stellen-kopf');
        t.append(knoten('h3', 'neben-titel', 'Auch in den Seiten gefunden'));
        const mehr = knoten('button', '', 'Alle Stellen in der Stichwortsuche'); mehr.type = 'button';
        mehr.addEventListener('click', function () { if (window.Suche) window.Suche.oeffnen('', q); });
        t.append(mehr);
        const ul = knoten('ul');
        stellen.forEach(function (s) {
          const li = knoten('li'), a = knoten('a'); a.href = s.href; a.style.setProperty('--farbe', s.farbe);
          a.append(knoten('span', 'art', s.art), knoten('span', 'stelle', s.text), knoten('small', '', s.seite));
          li.append(a); ul.append(li);
        });
        sek.append(t, ul);
        ziel.append(sek);
      }
    }

    // ---------- Inhalt zeichnen ----------
    function zeigen() {
      const ziel = $('liste');
      ziel.innerHTML = '';
      const q = anfrage();
      if (q) { sucheZeigen(ziel, q); return; }
      if (feld === FAV) {
        if (!favoritenZeigen(ziel, true)) ziel.append(knoten('p', 'leer', 'Noch keine Favoriten. Tippe auf den Stern an einer Karte oder oben auf einer Seite, um sie hier zu sammeln.'));
        return;
      }
      pfadZeigen(ziel);
      if (!feld) { zuletztZeigen(ziel); favoritenZeigen(ziel, false); felderZeigen(ziel, ''); return; }
      if (!bereich) {
        const fd = feldDaten(feld);
        felderZeigen(ziel, feld);
        fd.bereiche.forEach(function (b) { bereichZeigen(ziel, b, false); });
        return;
      }
      bereichZeigen(ziel, bereich, true);
    }

    let warte = 0;
    suchfeld.addEventListener('input', function () { alleTreffer = false; clearTimeout(warte); warte = setTimeout(zeigen, 90); if (anfrage().length >= 2) indexHolen(); });
    suchfeld.addEventListener('focus', indexHolen);
    suchfeld.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { const a = $('liste').querySelector('.treffer-seiten a'); if (a) { ev.preventDefault(); location.href = a.href; } }
      else if (ev.key === 'Escape' && suchfeld.value) { ev.preventDefault(); suchfeld.value = ''; zeigen(); }
    });

    ausAdresse();
    navBauen();
    zeigen();
    window.addEventListener('hashchange', function () { if (ausAdresse()) { navBauen(); zeigen(); } else if (location.hash === '#bereiche' && feld && feld !== FAV) { setze('', '', '', false); } });
  })();
  </script>
</body>
</html>
