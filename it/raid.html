<body>
  <div id="seitenkopf" data-wurzel="../"></div>

  <main class="seite" data-rechner data-merken></main>

  <div id="seitenfuss" data-wurzel="../"></div>

  <script src="../assets/katex/katex.min.js"></script>
  <script src="../assets/rechner.js"></script>
  <script>
  (function () {
    'use strict';
    const bewegungAus = false;
    const R = Rechner, z = R.zahl, tz = R.tz, E = R.E;

    // [Name, Mindestzahl, Schreibstrafe]
    const STUFE = {
      r0: ['RAID 0 (Striping)', 2, 1], r1: ['RAID 1 (Spiegel)', 2, 2], r5: ['RAID 5 (einfache Parität)', 3, 4], r6: ['RAID 6 (doppelte Parität)', 4, 6],
      r10: ['RAID 10 (Spiegel + Striping)', 4, 2], r50: ['RAID 50', 6, 4], r60: ['RAID 60', 8, 6], jbod: ['JBOD (einzelne Platten)', 1, 1]
    };
    const BEISPIEL = { modus: 'gleich', stufe: 'r5', n: 6, tb: 12, gruppe: 4, ure: '15', afr: 1.5, mbs: 250, iops: 180, rebuild: 120, spare: 'nein', tausch: 48,
      pools: [
        { geraet: 'NAS 1', name: 'Volume 1', stufe: 'raid5', platten: '3×4 + 2×8' },
        { geraet: 'NAS 1', name: 'SSD-Cache', stufe: 'raid1', platten: '2×1' },
        { geraet: 'NAS 2', name: 'Array', stufe: 'unraid1', platten: '18 + 2×12 + 8' },
        { geraet: 'Server', name: 'tank', stufe: 'z2', platten: '6×16' }
      ] };

    // ---------- Eigene Konfiguration: Stufen für gemischte Platten ----------
    // art: wie mit unterschiedlich großen Platten gerechnet wird; p: Ausfälle ohne Datenverlust; min: Mindestzahl Platten
    const STUFEM = {
      raid0: { name: 'RAID 0 (Striping)', art: 'klassisch', p: 0, min: 2 },
      raid1: { name: 'RAID 1 (alle gespiegelt)', art: 'spiegel', p: -1, min: 2 },
      raid5: { name: 'RAID 5', art: 'klassisch', p: 1, min: 3 },
      raid6: { name: 'RAID 6', art: 'klassisch', p: 2, min: 4 },
      raid10: { name: 'RAID 10', art: 'raid10', p: 1, min: 4 },
      shr1: { name: 'Hybrid-RAID, 1 Parität', art: 'schichten', p: 1, min: 2 },
      shr2: { name: 'Hybrid-RAID, 2 Paritäten', art: 'schichten', p: 2, min: 4 },
      zmirror: { name: 'ZFS Spiegel-Paare', art: 'paare', p: 1, min: 2 },
      z1: { name: 'ZFS RAIDZ1', art: 'klassisch', p: 1, min: 3 },
      z2: { name: 'ZFS RAIDZ2', art: 'klassisch', p: 2, min: 4 },
      z3: { name: 'ZFS RAIDZ3', art: 'klassisch', p: 3, min: 5 },
      btrfs1: { name: 'btrfs RAID 1', art: 'btrfs', p: 1, min: 2 },
      unraid1: { name: 'Paritätsplatten-Array, 1 Parität', art: 'paritaetsplatten', p: 1, min: 2 },
      unraid2: { name: 'Paritätsplatten-Array, 2 Paritäten', art: 'paritaetsplatten', p: 2, min: 3 },
      jbod: { name: 'JBOD / Span (verkettet)', art: 'jbod', p: 0, min: 1 }
    };
    const STUFEM_LISTE = Object.keys(STUFEM).map(function (k) { return [k, STUFEM[k].name]; });

    // Plattenangabe lesen: „3×4 + 2×8“, „8, 8, 12, 16“, „4x8TB 2x500GB“ → Größen in TB (absteigend)
    function plattenLesen(text) {
      let s = String(text || '').trim().replace(/\s*[×xX*]\s*/g, '×').replace(/,\s+/g, '+').replace(/;/g, '+');
      if (!s) return { fehler: 'keine Platten angegeben' };
      const teile = s.split(/[+\s]+/).filter(Boolean), liste = [];
      for (let i = 0; i < teile.length; i++) {
        const m = /^(?:(\d{1,2})×)?(\d{1,3}(?:[.,]\d{1,3})?)(tb|t|gb|g)?$/i.exec(teile[i]);
        if (!m) return { fehler: '„' + teile[i].slice(0, 12) + '“ nicht lesbar – Form wie 3×4 + 2×8' };
        const anz = m[1] ? Number(m[1]) : 1, groesse = Number(m[2].replace(',', '.')) / (/^g/i.test(m[3] || '') ? 1000 : 1);
        if (anz < 1 || anz > 64 || !(groesse >= 0.05 && groesse <= 100)) return { fehler: 'Größe je Platte 0,05 bis 100 TB, Anzahl 1 bis 64' };
        for (let k = 0; k < anz; k++) liste.push(groesse);
        if (liste.length > 64) return { fehler: 'höchstens 64 Platten je Pool' };
      }
      return { liste: liste.sort(function (a, b) { return b - a; }) };
    }
    // Kapazität eines Pools: nutzbar, Schutz (Parität/Spiegel), ungenutzt, je Platte belegt
    function poolRechnen(stufe, c) {
      const S = STUFEM[stufe], n = c.length, summe = c.reduce(function (a, b) { return a + b; }, 0), kmin = c[n - 1], aus = { n: n, summe: summe, c: c, S: S };
      aus.fehler = n < S.min ? S.name + ' braucht mindestens ' + S.min + ' Platten' : (S.art === 'raid10' || S.art === 'paare') && n % 2 ? S.name + ' braucht eine gerade Anzahl Platten' : '';
      let nutz = 0, schutz = 0, belegt = c.map(function () { return 0; }), rolle = c.map(function () { return 'd'; });
      if (S.art === 'klassisch' || S.art === 'spiegel' || S.art === 'raid10') {
        belegt = c.map(function () { return kmin; });
        nutz = S.art === 'spiegel' ? kmin : S.art === 'raid10' ? n / 2 * kmin : (n - S.p) * kmin;
        schutz = n * kmin - nutz;
      } else if (S.art === 'schichten') {
        // Schichten zwischen den Plattengrößen: Schicht mit k Platten bringt (k − p)·h, bei k ≤ p bleibt sie ungenutzt
        const grenze = n > S.p ? c[S.p] : 0;
        belegt = c.map(function (x) { return Math.min(x, grenze); });
        nutz = Math.max(0, summe - c.slice(0, S.p).reduce(function (a, b) { return a + b; }, 0));
        schutz = belegt.reduce(function (a, b) { return a + b; }, 0) - nutz;
      } else if (S.art === 'paare') {
        for (let i = 0; i + 1 < n; i += 2) { belegt[i] = c[i + 1]; belegt[i + 1] = c[i + 1]; nutz += c[i + 1]; }
        schutz = nutz;
      } else if (S.art === 'btrfs') {
        const rest = summe - c[0];
        nutz = Math.min(summe / 2, rest); schutz = nutz;
        belegt = c.slice(); if (c[0] > rest) belegt[0] = rest;
      } else if (S.art === 'paritaetsplatten') {
        belegt = c.slice(); for (let i = 0; i < Math.min(S.p, n); i++) rolle[i] = 'p';
        schutz = c.slice(0, S.p).reduce(function (a, b) { return a + b; }, 0); nutz = summe - schutz;
      } else { belegt = c.slice(); nutz = summe; schutz = 0; }
      aus.nutz = nutz; aus.schutz = schutz; aus.belegt = belegt; aus.rolle = rolle;
      aus.ungenutzt = Math.max(0, summe - belegt.reduce(function (a, b) { return a + b; }, 0));
      aus.tol = S.p < 0 ? n - 1 : S.p;
      aus.tolMax = S.art === 'raid10' || S.art === 'paare' ? Math.floor(n / 2) : aus.tol;
      return aus;
    }
    // Risiko je Pool, gleiches Modell wie oben
    function poolRisiko(x, e) {
      const lam = e.afr / 100 / 8760, ure = Math.pow(10, +e.ure), n = x.n, groesste = Math.max.apply(null, x.belegt.concat([0]));
      const tR = groesste * 1e12 / (e.rebuild * 1e6) / 3600, tA = tR + (e.spare === 'ja' ? 0 : e.tausch);
      const pd = function (m, t) { return 1 - Math.exp(-Math.max(0, m) * lam * t); };
      const lesen = (x.nutz + x.schutz) - groesste, pu = function (tb) { return 1 - Math.exp(-Math.max(0, tb) * 8e12 / ure); };
      let pv, pURE = 0;
      if (x.tol === 0) pv = 1;
      else if (x.S.art === 'spiegel' && n > 2) pv = Math.pow(pd(1, tA), n - 1);
      else if (x.S.art === 'raid10' || x.S.art === 'paare' || x.S.art === 'spiegel') { pURE = pu(groesste); pv = 1 - (1 - pURE) * (1 - pd(1, tA)); }
      else if (x.tol === 1) { pURE = pu(lesen); pv = 1 - (1 - pURE) * (1 - pd(n - 1, tA)); }
      else if (x.tol === 2) { pURE = pu(lesen * (n - 2) / Math.max(1, n - 1)); pv = pd(n - 1, tA) * (1 - (1 - pURE) * (1 - pd(n - 2, tR))); }
      else { pURE = pu(lesen * (n - 3) / Math.max(1, n - 1)); pv = pd(n - 1, tA) * pd(n - 2, tA) * (1 - (1 - pURE) * (1 - pd(n - 3, tR))); }
      x.tRebuild = tR; x.pURE = pURE; x.pv = pv; x.pJahr = 1 - Math.exp(-n * e.afr / 100 * pv);
      return x;
    }

    R.seite({
      titel: 'RAID- und Speicherrechner',
      einleitung: 'Nutzbare Kapazität, Ausfallsicherheit und Geschwindigkeit von RAID 0, 1, 5, 6, 10, 50 und 60 – mit Wiederaufbauzeit, Risiko eines Lesefehlers beim Rebuild und der Wahrscheinlichkeit von Datenverlust im Jahr. Eigene Konfigurationen: unterschiedlich große Platten, mehrere Pools und Geräte (NAS, Server) mit Hybrid-RAID, ZFS, btrfs, Paritätsplatten-Array oder klassischem RAID.',
      hilfe: 'RAID ersetzt keine Datensicherung: Löschen, Verschlüsselungstrojaner und Brand treffen alle Platten gleichzeitig.',
      gruppen: [
        { titel: 'Verbund', farbe: '#3B5BDB', felder: [
          { k: 'modus', name: 'Was rechnen?', wahl: [['gleich', 'ein RAID-Verbund mit gleichen Platten'], ['misch', 'eigene Konfiguration: gemischte Platten, mehrere Pools und Geräte']] },
          { k: 'stufe', name: 'RAID-Stufe', wahl: Object.keys(STUFE).map(function (k) { return [k, STUFE[k][0]]; }), wenn: gleich },
          { k: 'n', tex: 'n', name: 'Anzahl Platten', e: '', min: 1, max: 128, ganz: true, wenn: gleich },
          { k: 'gruppe', tex: 'g', name: 'Platten je Untergruppe', e: '', min: 3, max: 32, ganz: true, wenn: function (e) { return gleich(e) && (e.stufe === 'r50' || e.stufe === 'r60'); } },
          { k: 'tb', tex: 'c', name: 'Kapazität je Platte', e: 'TB', min: 0.1, max: 100, wenn: gleich },
          { k: 'spare', name: 'Hot Spare', wahl: [['nein', 'keine Ersatzplatte'], ['ja', 'Hot Spare vorhanden']] },
          { k: 'tausch', tex: 't_\\text{Tausch}', name: 'Zeit bis zum Plattentausch', e: 'h', min: 0, max: 2000, wenn: function (e) { return e.spare === 'nein'; } }
        ] },
        { titel: 'Pools und Geräte', farbe: '#E4572E', wenn: function (e) { return e.modus === 'misch'; }, hilfe: 'Je Zeile ein Pool oder Volume. Platten in TB: „3×4 + 2×8“, „8, 8, 12, 16“ oder „4x8TB 2x500GB“. Gleicher Gerätename fasst Pools zu einem Gerät zusammen.',
          liste: { k: 'pools', zeile: 'Pool', max: 30, kopieren: true,
            spalten: [
              { k: 'geraet', name: 'Gerät', text: true },
              { k: 'name', name: 'Pool / Volume', text: true },
              { k: 'stufe', name: 'Stufe', wahl: STUFEM_LISTE, text: true, breit: true },
              { k: 'platten', name: 'Platten in TB', text: true, breit: true }
            ],
            neu: function (i) { return { geraet: 'NAS ' + (i + 1), name: 'Pool ' + (i + 1), stufe: 'shr1', platten: '4×8' }; } } },
        { titel: 'Platten', farbe: '#0E6B6A', felder: [
          { k: 'mbs', tex: 'v', name: 'Lese-/Schreibrate je Platte', e: 'MB/s', min: 1, max: 20000, wenn: gleich },
          { k: 'iops', tex: 'IOPS', name: 'zufällige Zugriffe je Platte', e: '1/s', min: 1, max: 2000000, wenn: gleich },
          { k: 'rebuild', tex: 'v_\\text{Rebuild}', name: 'Rebuild-Rate', e: 'MB/s', min: 1, max: 20000 },
          { k: 'ure', name: 'Lesefehlerrate (URE)', wahl: [['14', '1 je 10¹⁴ bit (Desktop-Platte)'], ['15', '1 je 10¹⁵ bit (NAS-/Server-Platte)'], ['16', '1 je 10¹⁶ bit (Enterprise, SSD)'], ['17', '1 je 10¹⁷ bit (Enterprise-SSD)']] },
          { k: 'afr', tex: 'AFR', name: 'Ausfallrate im Jahr', e: '%', min: 0.01, max: 50 }
        ] }
      ],
      beispiel: BEISPIEL,
      rechne: function (e) { return gleich(e) ? rechne(e) : rechneMisch(e); },
      ergebnis: function (r, e, H) { if (gleich(e)) ergebnis(r, e, H); else ergebnisMisch(r, e, H); },
      weg: function (r, e) { return gleich(e) ? weg(r, e) : wegMisch(r, e); },
      sammlung: [
        ['Nutzbare Kapazität', 'C = (n - p) \\cdot c', 'p = Paritäts- bzw. Spiegelplatten: RAID 5 → 1, RAID 6 → 2, RAID 10 → n/2, RAID 50/60 → 1 bzw. 2 je Gruppe'],
        ['Rebuild-Zeit', 't_\\text{R} = \\frac{c}{v_\\text{Rebuild}}', 'unter Last oft deutlich länger'],
        ['Lesefehler beim Rebuild', 'P_\\text{URE} = 1 - e^{-\\frac{b}{URE}}', 'b = gelesene Bits aller übrigen Platten'],
        ['Zweiter Ausfall beim Rebuild', 'P_2 = 1 - e^{-m \\cdot \\lambda \\cdot t},\\quad \\lambda = \\frac{AFR}{8760\\,\\text{h}}', 'm = Platten, deren Ausfall jetzt zum Verlust führt; t = Tauschzeit + Rebuild'],
        ['Datenverlust im Jahr', 'P_\\text{Jahr} \\approx 1 - e^{-n \\cdot AFR \\cdot P_\\text{Verlust|Ausfall}}', 'vereinfachtes Modell mit unabhängigen Ausfällen; reale Platten aus einer Charge fallen oft gemeinsam aus'],
        ['Schreibleistung', 'IOPS_\\text{schreiben} = \\frac{n \\cdot IOPS}{s}', 's = Schreibstrafe: RAID 1/10 → 2, RAID 5 → 4, RAID 6 → 6'],
        ['Klassisches RAID mit gemischten Platten', 'C = (n - p) \\cdot c_\\text{min}', 'jede Platte zählt nur so groß wie die kleinste; gilt auch für ZFS RAIDZ'],
        ['Hybrid-RAID und Paritätsplatten-Array', 'C = \\sum c_i - \\sum_{j=1}^{p} c_{\\max,j}', 'Summe aller Platten minus die p größten (p = Zahl der Paritäten)'],
        ['ZFS Spiegel-Paare', 'C = \\sum_\\text{Paare} \\min(c_a, c_b)', 'jedes Paar zählt so groß wie seine kleinere Platte'],
        ['btrfs RAID 1', 'C = \\min\\left(\\frac{\\sum c_i}{2};\\ \\sum c_i - c_{\\max}\\right)', 'jeder Block liegt auf zwei verschiedenen Platten']
      ],
      quellen: 'SNIA-Definitionen der RAID-Stufen; Fehlerraten nach Herstellerdatenblättern; Zuverlässigkeitsmodell vereinfacht (exponentielle Ausfälle, unabhängige Platten). TB = 10¹² Byte, das Betriebssystem zeigt TiB (2⁴⁰ Byte) an.',
      bild: { titel: 'Ausfall und Wiederaufbau', label: 'Platten mit Datenblöcken und Parität; eine Platte fällt aus und wird neu aufgebaut', animiert: !bewegungAus,
        hoehe: function (B, e) { return e && e.modus === 'misch' ? Math.max(200, Math.min(620, 70 + 96 * Math.min(6, (e.pools || []).length))) : Math.max(240, Math.min(320, B * 0.5)); },
        zeichne: function (cx, B, H, t, r, e) { if (gleich(e)) zeichne(cx, B, H, t, r, e); else zeichneMisch(cx, B, H, t, r, e); },
        hinweis: function (r, e) { if (!gleich(e)) return 'Jede Säule eine Platte, Höhe nach Größe: blau nutzbar, orange Schutz (Parität oder Spiegel), grau schraffiert ungenutzt. Ein Lichtstreifen zeigt den Wiederaufbau der größten Platte.'; return r.tol === 0 ? 'Ohne Redundanz: Fällt eine Platte aus, sind die Daten weg.' : 'Fällt eine Platte aus, rechnet der Controller ihren Inhalt aus den übrigen zurück.'; } }
    });

    function gleich(e) { return e.modus !== 'misch'; }
    function prozent(p) { return p < 0.0001 ? '< 0,01 %' : p > 0.9999 ? '> 99,99 %' : z(p * 100, p < 0.01 ? 3 : p < 0.1 ? 2 : 1) + ' %'; }
    function rechne(e) {
      const r = {}, s = STUFE[e.stufe];
      r.n = e.n; r.c = e.tb;
      r.min = s[1];
      r.gs = (e.stufe === 'r50' || e.stufe === 'r60') ? e.gruppe : e.n;
      r.gruppen = Math.max(1, Math.floor(e.n / r.gs));
      r.okZahl = e.n >= s[1] && (e.stufe !== 'r10' || e.n % 2 === 0) && ((e.stufe !== 'r50' && e.stufe !== 'r60') || (e.n % e.gruppe === 0 && r.gruppen >= 2 && e.gruppe >= (e.stufe === 'r50' ? 3 : 4)));
      const p = { r0: 0, r1: e.n - 1, r5: 1, r6: 2, r10: e.n / 2, r50: r.gruppen, r60: 2 * r.gruppen, jbod: 0 }[e.stufe];
      r.paritaet = p;
      r.nutz = Math.max(0, (e.n - p) * e.tb);
      r.nutzTiB = r.nutz * 1e12 / Math.pow(2, 40);
      r.effizienz = r.nutz / (e.n * e.tb) * 100;
      r.tol = { r0: 0, r1: e.n - 1, r5: 1, r6: 2, r10: 1, r50: 1, r60: 2, jbod: 0 }[e.stufe];
      r.tolMax = { r10: e.n / 2, r50: r.gruppen, r60: 2 * r.gruppen }[e.stufe] || r.tol;
      r.lesen = (e.stufe === 'jbod' ? 1 : e.n) * e.mbs;
      r.schreibSeq = { r0: e.n, r1: 1, r5: e.n - 1, r6: e.n - 2, r10: e.n / 2, r50: e.n - r.gruppen, r60: e.n - 2 * r.gruppen, jbod: 1 }[e.stufe] * e.mbs;
      r.iopsL = (e.stufe === 'jbod' ? 1 : e.n) * e.iops;
      r.iopsS = (e.stufe === 'jbod' ? 1 : e.n) * e.iops / s[2];
      r.tRebuild = e.tb * 1e12 / (e.rebuild * 1e6) / 3600;
      r.tAusgesetzt = r.tRebuild + (e.spare === 'ja' ? 0 : e.tausch);
      const lam = e.afr / 100 / 8760, ure = Math.pow(10, +e.ure);
      const bits = function (platten) { return platten * e.tb * 8e12; };
      const pd = function (m, t) { return 1 - Math.exp(-m * lam * t); };
      const pu = function (platten) { return 1 - Math.exp(-bits(platten) / ure); };
      let pv, pURE = 0, p2 = 0;
      if (e.stufe === 'r0' || e.stufe === 'jbod') { pv = 1; }
      else if (e.stufe === 'r1' && e.n > 2) { p2 = Math.pow(pd(1, r.tAusgesetzt), e.n - 1); pv = p2; }
      else if (e.stufe === 'r1' || e.stufe === 'r10') { pURE = pu(1); p2 = pd(1, r.tAusgesetzt); pv = 1 - (1 - pURE) * (1 - p2); }
      else if (e.stufe === 'r5' || e.stufe === 'r50') { const g = r.gs; pURE = pu(g - 1); p2 = pd(g - 1, r.tAusgesetzt); pv = 1 - (1 - pURE) * (1 - p2); }
      else { const g = r.gs; p2 = pd(g - 1, r.tAusgesetzt); pURE = pu(g - 2); const p3 = pd(g - 2, r.tRebuild); pv = p2 * (1 - (1 - pURE) * (1 - p3)); }
      r.pURE = pURE; r.p2 = p2; r.pv = pv;
      r.pJahr = 1 - Math.exp(-e.n * e.afr / 100 * pv);
      r.pJahr0 = 1 - Math.exp(-e.n * e.afr / 100);
      return r;
    }
    function ergebnis(r, e, H) {
      const s = STUFE[e.stufe];
      if (!r.okZahl) H.meldung(s[0] + ' braucht mindestens ' + s[1] + ' Platten' + (e.stufe === 'r10' ? ' und eine gerade Anzahl' : '') + ((e.stufe === 'r50' || e.stufe === 'r60') ? ', mindestens zwei gleich große Gruppen (Anzahl durch Gruppengröße teilbar)' : '') + '.', true);
      if (e.stufe === 'r5' && e.tb >= 4 && r.pURE > 0.05) H.meldung('Bei großen Platten ist RAID 5 riskant: Beim Wiederaufbau müssen ' + z((r.gs - 1) * e.tb, 0) + ' TB fehlerfrei gelesen werden, ein einziger Lesefehler ' + '(' + prozent(r.pURE) + ') kann den Rebuild scheitern lassen. RAID 6 oder RAID 10 wählen.', true);
      if (r.tol === 0) H.meldung('Keine Redundanz: Der Ausfall einer Platte bedeutet Datenverlust.', true);
      if (e.spare === 'nein' && e.tausch > 24) H.meldung('Ohne Hot Spare läuft der Verbund ' + z(e.tausch, 0) + ' h ungeschützt, bis die Platte getauscht ist – Ersatzplatte vorhalten oder Hot Spare einbauen.');
      H.meldung('RAID schützt nur vor Plattenausfall. Für alles andere gilt die 3-2-1-Regel der Datensicherung.');
